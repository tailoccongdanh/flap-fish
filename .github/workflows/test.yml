name: Test Godot Project

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Godot v4.1.3
      uses: chickensoft-games/setup-godot@v1
      with:
        version: 4.1.3
        use-dotnet: false
    
    - name: Check Project Files
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo ""
        echo "=== Scenes Directory ==="
        ls -la scenes/ || echo "No scenes directory"
        echo ""
        echo "=== Project Config ==="
        head -20 project.godot
    
    - name: Validate Godot Project
      run: |
        echo "Checking Godot project validity..."
        godot --headless --editor --quit 2>&1 || echo "Validation completed"
    
    - name: Test Export Presets
      run: |
        echo "=== Export Presets ==="
        cat export_presets.cfg || echo "No export_presets.cfg found"
    
    - name: Success Message
      run: echo "✅ Project structure verified"
